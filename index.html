<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Viewer - Workshop7_trial</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --sidebar-width: 320px;
            --header-height: 50px;
            --primary-bg: #1e1e1e;
            --sidebar-bg: #252526;
            --hover-bg: #2a2d2e;
            --active-bg: #37373d;
            --text-color: #cccccc;
            --accent-color: #007acc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: var(--header-height);
            background-color: #323233;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 1000;
            border-bottom: 1px solid #444;
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin-right: 15px;
        }

        .logo { font-size: 0.9rem; font-weight: 600; flex-grow: 1; color: #fff; }

        .upload-btn-wrapper { position: relative; overflow: hidden; }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 2px;
            font-size: 12px;
            cursor: pointer;
        }
        .upload-btn-wrapper input[type=file] {
            position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }

        .container { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar Tree */
        aside {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 900;
            font-size: 13px;
            user-select: none;
        }

        .tree-node { padding-left: 15px; }
        .tree-item {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .tree-item:hover { background-color: var(--hover-bg); }
        .tree-item.active { background-color: var(--active-bg); color: #fff; }
        
        .icon { width: 18px; margin-right: 6px; text-align: center; font-style: normal; }
        .folder-icon::before { content: '▸'; display: inline-block; transition: transform 0.2s; margin-right: 4px; }
        .folder-open > .tree-item > .folder-icon::before { transform: rotate(90deg); }
        
        .children { display: none; }
        .folder-open > .children { display: block; }

        /* Content Area */
        main { flex: 1; overflow: auto; background-color: var(--primary-bg); position: relative; }
        pre { margin: 0 !important; border-radius: 0 !important; min-height: 100%; }
        code { font-family: 'Consolas', monospace !important; font-size: 13px; }

        .placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #666; text-align: center;
        }

        /* Mobile Overlay */
        .overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 850;
        }

        @media (max-width: 768px) {
            .hamburger { display: block; }
            aside {
                position: absolute; top: 0; left: 0; bottom: 0;
                transform: translateX(-100%); width: 80%; max-width: 300px;
                box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            }
            aside.open { transform: translateX(0); }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="logo">CODE VIEWER - VS STYLE</div>
        <div class="upload-btn-wrapper">
            <button class="btn">開啟資料夾</button>
            <input type="file" id="fileInput" webkitdirectory directory multiple>
        </div>
    </header>

    <div class="container">
        <div class="overlay" id="overlay"></div>
        <aside id="sidebar">
            <div id="treeRoot"></div>
        </aside>
        <main id="mainContent">
            <div class="placeholder" id="placeholder">
                <p>選擇一個檔案以查看內容</p>
            </div>
            <pre id="codeBlock" class="hidden"><code id="codeContent" class="language-java"></code></pre>
        </main>
    </div>

" to=\"*\" type=\"glob\"/>\n                    </syspropertyset>\n                    <customize/>\n                </java>\n            </sequential>\n        </macrodef>\n    </target>\n    <target name=\"-init-macrodef-nbjsdebug\">\n        <macrodef name=\"nbjsdebugstart\" uri=\"http://www.netbeans.org/ns/web-project/1\">\n            <attribute default=\"${client.url}\" name=\"webUrl\"/>\n            <sequential>\n                <nbjsdebugstart urlPart=\"${client.urlPart}\" webUrl=\"@{webUrl}\"/>\n            </sequential>\n        </macrodef>\n    </target>\n    <target depends=\"-init-debug-args\" name=\"-init-macrodef-nbjpda\">\n        <macrodef name=\"nbjpdastart\" uri=\"http://www.netbeans.org/ns/web-project/1\">\n            <attribute default=\"${main.class}\" name=\"name\"/>\n            <attribute default=\"${debug.classpath}:${j2ee.platform.classpath}\" name=\"classpath\"/>\n            <sequential>\n                <nbjpdastart addressproperty=\"jpda.address\" name=\"@{name}\" transport=\"${debug-transport}\">\n                    <classpath>\n                        <path path=\"@{classpath}\"/>\n                    </classpath>\n                </nbjpdastart>\n            </sequential>\n        </macrodef>\n        <macrodef name=\"nbjpdareload\" uri=\"http://www.netbeans.org/ns/web-project/1\">\n            <attribute default=\"${build.classes.dir}\" name=\"dir\"/>\n            <sequential>\n                <nbjpdareload>\n                    <fileset dir=\"@{dir}\" includes=\"${fix.classes}\">\n                        <include name=\"${fix.includes}*.class\"/>\n                    </fileset>\n                </nbjpdareload>\n            </sequential>\n        </macrodef>\n        <macrodef name=\"nbjpdaappreloaded\" uri=\"http://www.netbeans.org/ns/web-project/1\">\n            <sequential>\n                <nbjpdaappreloaded/>\n            </sequential>\n        </macrodef>\n    </target>\n    <target name=\"-init-debug-args\">\n        <property name=\"version-output\" value=\"java version &quot;${ant.java.version}\"/>\n        <condition property=\"have-jdk-older-than-1.4\">\n            <or>\n                <contains string=\"${version-output}\" substring=\"java version &quot;1.0\"/>\n                <contains string=\"${version-output}\" substring=\"java version &quot;1.1\"/>\n                <contains string=\"${version-output}\" substring=\"java version &quot;1.2\"/>\n                <contains string=\"${version-output}\" substring=\"java version &quot;1.3\"/>\n            </or>\n        </condition>\n        <condition else=\"-Xdebug\" property=\"debug-args-line\" value=\"-Xdebug -Xnoagent -Djava.compiler=none\">\n            <istrue value=\"${have-jdk-older-than-1.4}\"/>\n        </condition>\n        <condition else=\"dt_socket\" property=\"debug-transport-by-os\" value=\"dt_shmem\">\n            <os family=\"windows\"/>\n        </condition>\n        <condition else=\"${debug-transport-by-os}\" property=\"debug-transport\" value=\"${debug.transport}\">\n            <isset property=\"debug.transport\"/>\n        </condition>\n    </target>\n    <target depends=\"-init-debug-args\" name=\"-init-macrodef-debug\">\n        <macrodef name=\"debug\" uri=\"http://www.netbeans.org/ns/web-project/1\">\n            <attribute default=\"${main.class}\" name=\"classname\"/>\n            <attribute default=\"${debug.classpath}:${j2ee.platform.classpath}\" name=\"classpath\"/>\n            <attribute default=\"${application.args.param}\" name=\"args\"/>\n            <element name=\"customize\" optional=\"true\"/>\n            <sequential>\n                <java classname=\"@{classname}\" fork=\"true\">\n                    <jvmarg line=\"${endorsed.classpath.cmd.line.arg}\"/>\n                    <jvmarg line=\"${debug-args-line}\"/>\n                    <jvmarg value=\"-Xrunjdwp:transport=${debug-transport},address=${jpda.address}\"/>\n                    <jvmarg line=\"${runmain.jvmargs}\"/>\n                    <classpath>\n                        <path path=\"@{classpath}\"/>\n                    </classpath>\n                    <syspropertyset>\n                        <propertyref prefix=\"run-sys-prop.\"/>\n                        <mapper from=\"run-sys-prop.*\" to=\"*\" type=\"glob\"/>\n                    </syspropertyset>\n                    <arg line=\"@{args}\"/>\n                    <customize/>\n                </java>\n            </sequential>\n        </macrodef>\n    </target>\n    <target name=\"-init-taskdefs\">\n        <fail unless=\"libs.CopyLibs.classpath\">\nThe libs.CopyLibs.classpath property is not set up.\nThis property must point to \norg-netbeans-modules-java-j2seproject-copylibstask.jar file which is part\nof NetBeans IDE installation and is usually located at \n&lt;netbeans_installation&gt;/java&lt;version&gt;/ant/extra folder.\nEither open the project in the IDE and make sure CopyLibs library\nexists or setup the property manually. For example like this:\n ant -Dlibs.CopyLibs.classpath=a/path/to/org-netbeans-modules-java-j2seproject-copylibstask.jar\n                </fail>\n        <taskdef classpath=\"${libs.CopyLibs.classpath}\" resource=\"org/netbeans/modules/java/j2seproject/copylibstask/antlib.xml\"/>\n    </target>\n    <target name=\"-init-ap-cmdline-properties\">\n        <property name=\"annotation.processing.enabled\" value=\"true\"/>\n        <property name=\"annotation.processing.processors.list\" value=\"\"/>\n        <property name=\"annotation.processing.run.all.processors\" value=\"true\"/>\n        <property name=\"javac.processorpath\" value=\"${javac.classpath}\"/>\n        <property name=\"javac.test.processorpath\" value=\"${javac.test.classpath}\"/>\n        <condition property=\"ap.supported.internal\" value=\"true\">\n            <not>\n                <matches pattern=\"1\\.[0-5](\\..*)?\" string=\"${javac.source}\"/>\n            </not>\n        </condition>\n    </target>\n    <target depends=\"-init-ap- ar.dir\"/>\n        <mkdir dir=\"${dist.jar.dir}\"/>\n        <jar compress=\"${jar.compress}\" jarfile=\"${dist.war}\" manifest=\"${build.meta.inf.dir}/MANIFEST.MF\">\n            <fileset dir=\"${build.web.dir}\" excludes=\"WEB-INF/classes/.netbeans_*,${dist.archive.excludes}\"/>\n        </jar>\n    </target>\n    <target depends=\"init,compile,compile-jsps,-pre-dist\" if=\"do.tmp.war.package.without.custom.manifest\" name=\"-do-tmp-dist-without-manifest\">\n        <dirname file=\"${dist.war}\" property=\"dist.jar.dir\"/>\n        <mkdir dir=\"${dist.jar.dir}\"/>\n        <jar compress=\"${jar.compress}\" jarfile=\"${dist.war}\">\n            <fileset dir=\"${build.web.dir}\" excludes=\"WEB-INF/classes/.netbeans_*,${dist.archive.excludes}\"/>\n        </jar>\n    </target>\n    <target depends=\"init,compile,compile-jsps,-pre-dist\" if=\"do.tmp.war.package.with.custom.manifest\" name=\"-do-tmp-dist-with-manifest\">\n        <dirname file=\"${dist.war}\" property=\"dist.jar.dir\"/>\n        <mkdir dir=\"${dist.jar.dir}\"/>\n        <jar compress=\"${jar.compress}\" jarfile=\"${dist.war}\" manifest=\"${build.meta.inf.dir}/MANIFEST.MF\">\n            <fileset dir=\"${build.web.dir}\" excludes=\"WEB-INF/classes/.netbeans_*,${dist.archive.excludes}\"/>\n        </jar>\n    </target>\n    <target depends=\"init,compile,compile-jsps,-pre-dist,-do-dist-with-manifest,-do-dist-without-manifest\" name=\"do-dist\"/>\n    <target depends=\"init\" if=\"dist.ear.dir\" name=\"library-inclusion-in-manifest\">\n        <copyfiles files=\"${libs.MySQLDriver.classpath}\" iftldtodir=\"${build.web.dir}/WEB-INF\" todir=\"${dist.ear.dir}/lib\"/>\n        <mkdir dir=\"${build.web.dir}/META-INF\"/>\n        <manifest file=\"${build.web.dir}/META-INF/MANIFEST.MF\" mode=\"update\"/>\n    </target>\n    <target depends=\"init\" name=\"library-inclusion-in-archive\" unless=\"dist.ear.dir\">\n        <copyfiles files=\"${libs.MySQLDriver.classpath}\" todir=\"${build.web.dir}/WEB-INF/lib\"/>\n    </target>\n    <target depends=\"init\" if=\"dist.ear.dir\" name=\"-clean-webinf-lib\">\n        <delete dir=\"${build.web.dir}/WEB-INF/lib\"/>\n    </target>\n    <target depends=\"init,-clean-webinf-lib,compile,compile-jsps,-pre-dist,library-inclusion-in-manifest\" if=\"do.tmp.war.package\" name=\"do-ear-dist\">\n        <dirname file=\"${dist.ear.war}\" property=\"dist.jar.dir\"/>\n        <mkdir dir=\"${dist.jar.dir}\"/>\n        <jar compress=\"${jar.compress}\" jarfile=\"${dist.ear.war}\" manifest=\"${build.web.dir}/META-INF/MANIFEST.MF\">\n            <fileset dir=\"${build.web.dir}\" excludes=\"WEB-INF/classes/.netbeans_*,${dist.archive.excludes}\"/>\n        </jar>\n    </target>\n    <target name=\"-post-dist\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target depends=\"init,compile,-pre-dist,do-dist,-post-dist\" description=\"Build distribution (WAR).\" name=\"dist\"/>\n    <target depends=\"init,-clean-webinf-lib,-init-cos,compile,-pre-dist,do-ear-dist,-post-dist\" description=\"Build distribution (WAR) to be packaged into an EAR.\" name=\"dist-ear\"/>\n    <!--\n                EXECUTION SECTION\n            -->\n    <target depends=\"run-deploy,run-display-browser\" description=\"Deploy to server and show in browser.\" name=\"run\"/>\n    <target name=\"-pre-run-deploy\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target name=\"-post-run-deploy\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target name=\"-pre-nbmodule-run-deploy\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- This target can be overriden by NetBeans modules. Don't override it directly, use -pre-run-deploy task instead. -->\n    </target>\n    <target name=\"-post-nbmodule-run-deploy\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- This target can be overriden by NetBeans modules. Don't override it directly, use -post-run-deploy task instead. -->\n    </target>\n    <target name=\"-run-deploy-am\">\n        <!-- Task to deploy to the Access Manager runtime. -->\n    </target>\n    <target depends=\"init,-init-cos,compile,compile-jsps,-do-compile-single-jsp,-pre-dist,-do-tmp-dist-with-manifest,-do-tmp-dist-without-manifest,-pre-run-deploy,-pre-nbmodule-run-deploy,-run-deploy-nb,-init-deploy-ant,-deploy-ant,-run-deploy-am,-post-nbmodule-run-deploy,-post-run-deploy,-do-update-breakpoints\" name=\"run-deploy\"/>\n    <target if=\"netbeans.home\" name=\"-run-deploy-nb\">\n        <nbdeploy clientUrlPart=\"${client.urlPart}\" debugmode=\"false\" forceRedeploy=\"${forceRedeploy}\"/>\n    </target>\n    <target name=\"-init-deploy-ant\" unless=\"netbeans.home\">\n        <property name=\"deploy.ant.archive\" value=\"${dist.war}\"/>\n        <property name=\"deploy.ant.docbase.dir\" value=\"${web.docbase.dir}\"/>\n        <property name=\"deploy.ant.resource.dir\" value=\"${resource.dir}\"/>\n        <property name=\"deploy.ant.enabled\" value=\"true\"/>\n    </target>\n    <target depends=\"dist,-run-undeploy-nb,-init-deploy-ant,-undeploy-ant\" name=\"run-undeploy\"/>\n    <target if=\"netbeans.home\" name=\"-run-undeploy-nb\">\n        <fail message=\"Undeploy is not supported from within the IDE\"/>\n    </target>\n    <target depends=\"init,-pre-dist,dist,-post-dist\" name=\"verify\">\n        <nbverify file=\"${dist.war}\"/>\n    </target>\n    <target depends=\"run-deploy,-init-display-browser,-display-browser-nb-old,-display-browser-nb,-display-browser-cl\" name=\"run-display-browser\"/>\n    <target if=\"do.display.browser\" name=\"-init-display-browser\">\n        <condition property=\"do.display.browser.nb.old\">\n            <and>\n                <isset property=\"netbeans.home\"/>\n                <not>\n                    <isset property=\"browser.context\"/>\n                </not>\n            </and>\n        </condition>\n        <condition property=\"do.display.browser.nb\">\n            <and>\n                <isset property=\"netbeans.home\"/>\n                <isset property=\"browser.context\"/>\n            </and>\n        </condition>\n        <condition property=\"do.display.browser.cl\">\n            <isset property=\"deploy.ant.enabled\"/>\n        </condition>\n    </target>\n    <target if=\"do.display.browser.nb.old\" name=\"-display-browser-nb-old\">\n        <nbbrowse url=\"${client.url}\"/>\n    </target>\n    <target if=\"do.display.browser.nb\" name=\"-display-browser-nb\">\n        <nbbrowse context=\"${browser.context}\" url=\"${client.url}\" urlPath=\"${client.urlPart}\"/>\n    </target>\n    <target if=\"do.display.browser.cl\" name=\"-get-browser\" unless=\"browser\">\n        <condition property=\"browser\" value=\"rundll32\">\n            <os family=\"windows\"/>\n        </condition>\n        <condition else=\"\" property=\"browser.args\" value=\"url.dll,FileProtocolHandler\">\n            <os family=\"windows\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/bin/open\">\n            <os family=\"mac\"/>\n        </condition>\n        <property environment=\"env\"/>\n        <condition property=\"browser\" value=\"${env.BROWSER}\">\n            <isset property=\"env.BROWSER\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/bin/firefox\">\n            <available file=\"/usr/bin/firefox\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/local/firefox/firefox\">\n            <available file=\"/usr/local/firefox/firefox\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/bin/mozilla\">\n            <available file=\"/usr/bin/mozilla\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/local/mozilla/mozilla\">\n            <available file=\"/usr/local/mozilla/mozilla\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/sfw/lib/firefox/firefox\">\n            <available file=\"/usr/sfw/lib/firefox/firefox\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/opt/csw/bin/firefox\">\n            <available file=\"/opt/csw/bin/firefox\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/usr/sfw/lib/mozilla/mozilla\">\n            <available file=\"/usr/sfw/lib/mozilla/mozilla\"/>\n        </condition>\n        <condition property=\"browser\" value=\"/opt/csw/bin/mozilla\">\n            <available file=\"/opt/csw/bin/mozilla\"/>\n        </condition>\n    </target>\n    <target depends=\"-get-browser\" if=\"do.display.browser.cl\" name=\"-display-browser-cl\">\n        <fail unless=\"browser\">\n                    Browser not found, cannot launch the deployed application. Try to set the BROWSER environment variable.\n                </fail>\n        <property name=\"browse.url\" value=\"${deploy.ant.client.url}${client.urlPart}\"/>\n        <echo>Launching ${browse.url}</echo>\n        <exec executable=\"${browser}\" spawn=\"true\">\n            <arg line=\"${browser.args} ${browse.url}\"/>\n        </exec>\n    </target>\n    <target depends=\"init,-init-cos,compile-single\" name=\"run-main\">\n        <fail unless=\"run.class\">Must select one file in the IDE or set run.class</fail>\n        <webproject1:java classname=\"${run.class}\"/>\n    </target>\n    <target depends=\"init,compile-test-single,-pre-test-run-single\" name=\"run-test-with-main\">\n        <fail unless=\"run.class\">Must select one file in the IDE or set run.class</fail>\n        <webproject1:java classname=\"${run.class}\" classpath=\"${run.test.classpath}\"/>\n    </target>\n    <target depends=\"init\" if=\"netbeans.home\" name=\"-do-update-breakpoints\">\n        <webproject1:nbjpdaappreloaded/>\n    </target>\n    <!--\n                DEBUGGING SECTION\n            -->\n    <target depends=\"init,-init-cos,compile,compile-jsps,-do-compile-single-jsp,-pre-dist,-do-tmp-dist-with-manifest,-do-tmp-dist-without-manifest\" description=\"Debug project in IDE.\" if=\"netbeans.home\" name=\"debug\">\n        <nbstartserver debugmode=\"true\"/>\n        <antcall target=\"connect-debugger\"/>\n        <nbdeploy clientUrlPart=\"${client.urlPart}\" debugmode=\"true\" forceRedeploy=\"true\"/>\n        <antcall target=\"debug-display-browser-old\"/>\n        <antcall target=\"debug-display-browser\"/>\n        <antcall target=\"connect-client-debugger\"/>\n    </target>\n    <target if=\"do.debug.server\" name=\"connect-debugger\" unless=\"is.debugged\">\n        <condition property=\"listeningcp\" value=\"sourcepath\">\n            <istrue value=\"${j2ee.compile.on.save}\"/>\n        </condition>\n        <nbjpdaconnect address=\"${jpda.address}\" host=\"${jpda.host}\" listeningcp=\"${listeningcp}\" name=\"${name}\" transport=\"${jpda.transport}\">\n            <classpath>\n                <path path=\"${debug.classpath}:${j2ee.platform.classpath}\"/>\n            </classpath>\n            <sourcepath>\n                <path path=\"${web.docbase.dir}\"/>\n            </sourcepath>\n        </nbjpdaconnect>\n    </target>\n    <target if=\"do.display.browser.debug.old\" name=\"debug-display-browser-old\">\n        <nbbrowse url=\"${client.url}\"/>\n    </target>\n    <target if=\"do.display.browser.debug\" name=\"debug-display-browser\">\n        <nbbrowse context=\"${browser.context}\" url=\"${client.url}\" urlPath=\"${client.urlPart}\"/>\n    </target>\n    <target if=\"do.debug.client\" name=\"connect-client-debugger\">\n        <webproject1:nbjsdebugstart webUrl=\"${client.url}\"/>\n    </target>\n    <target depends=\"init,compile-test-single\" if=\"netbeans.home\" name=\"-debug-start-debuggee-main-test\">\n        <fail unless=\"debug.class\">Must select one file in the IDE or set debug.class</fail>\n        <webproject1:debug classname=\"${debug.class}\" classpath=\"${debug.test.classpath}\"/>\n    </target>\n    <target depends=\"init,compile-test-single,-debug-start-debugger-main-test,-debug-start-debuggee-main-test\" if=\"netbeans.home\" name=\"debug-test-with-main\"/>\n    <target depends=\"init,compile,compile-jsps,-do-compile-single-jsp,debug\" if=\"netbeans.home\" name=\"debug-single\"/>\n    <target depends=\"init\" if=\"netbeans.home\" name=\"-debug-start-debugger-main-test\">\n        <webproject1:nbjpdastart classpath=\"${debug.test.classpath}\" name=\"${debug.class}\"/>\n    </target>\n    <target depends=\"init\" if=\"netbeans.home\" name=\"-debug-start-debugger\">\n        <webproject1:nbjpdastart name=\"${debug.class}\"/>\n    </target>\n    <target depends=\"init,compile-single\" if=\"netbeans.home\" name=\"-debug-start-debuggee-single\">\n        <fail unless=\"debug.class\">Must select one file in the IDE or set debug.class</fail>\n        <webproject1:debug classname=\"${debug.class}\"/>\n    </target>\n    <target depends=\"init,compile-single,-debug-start-debugger,-debug-start-debuggee-single\" if=\"netbeans.home\" name=\"debug-single-main\"/>\n    <target depends=\"init\" name=\"-pre-debug-fix\">\n        <fail unless=\"fix.includes\">Must set fix.includes</fail>\n        <property name=\"javac.includes\" value=\"${fix.includes}.java\"/>\n    </target>\n    <target depends=\"init,-pre-debug-fix,compile-single\" if=\"netbeans.home\" name=\"-do-debug-fix\">\n        <webproject1:nbjpdareload/>\n    </target>\n    <target depends=\"init,-pre-debug-fix,-do-debug-fix\" if=\"netbeans.home\" name=\"debug-fix\"/>\n    <!--\n            =================\n            PROFILING SECTION\n            =================\n            -->\n    <!--\n                pre NB7.2 profiling section; consider it deprecated\n            -->\n    <target description=\"Profile a J2EE project in the IDE.\" if=\"profiler.info.jvmargs.agent\" name=\"-profile-pre72\">\n        <condition else=\"start-profiled-server\" property=\"profiler.startserver.target\" value=\"start-profiled-server-extraargs\">\n            <isset property=\"profiler.info.jvmargs.extra\"/>\n        </condition>\n        <antcall target=\"${profiler.startserver.target}\"/>\n        <antcall target=\"run\"/>\n        <antcall target=\"-profile-start-loadgen\"/>\n    </target>\n    <target if=\"profiler.info.jvmargs.agent\" name=\"start-profiled-server\">\n        <nbstartprofiledserver forceRestart=\"${profiler.j2ee.serverForceRestart}\" javaPlatform=\"${profiler.info.javaPlatform}\" startupTimeout=\"${profiler.j2ee.serverStartupTimeout}\">\n            <jvmarg value=\"${profiler.info.jvmargs.agent}\"/>\n            <jvmarg value=\"${profiler.j2ee.agentID}\"/>\n        </nbstartprofiledserver>\n    </target>\n    <target if=\"profiler.info.jvmargs.agent\" name=\"start-profiled-server-extraargs\">\n        <nbstartprofiledserver forceRestart=\"${profiler.j2ee.serverForceRestart}\" javaPlatform=\"${profiler.info.javaPlatform}\" startupTimeout=\"${profiler.j2ee.serverStartupTimeout}\">\n            <jvmarg value=\"${profiler.info.jvmargs.extra}\"/>\n            <jvmarg value=\"${profiler.info.jvmargs.agent}\"/>\n            <jvmarg value=\"${profiler.j2ee.agentID}\"/>\n        </nbstartprofiledserver>\n    </target>\n    <target depends=\"profile-init,compile-test-single\" if=\"profiler.info.jvmargs.agent\" name=\"-profile-test-single-pre72\">\n        <fail unless=\"netbeans.home\">This target only works when run from inside the NetBeans IDE.</fail>\n        <nbprofiledirect>\n            <classpath>\n                <path path=\"${run.test.classpath}\"/>\n                <path path=\"${j2ee.platform.classpath}\"/>\n            </classpath>\n        </nbprofiledirect>\n        <junit dir=\"${profiler.info.dir}\" errorproperty=\"tests.failed\" failureproperty=\"tests.failed\" fork=\"true\" jvm=\"${profiler.info.jvm}\" showoutput=\"true\">\n            <env key=\"${profiler.info.pathvar}\" path=\"${profiler.info.agentpath}:${profiler.current.path}\"/>\n            <jvmarg value=\"${profiler.info.jvmargs.agent}\"/>\n            <jvmarg line=\"${profiler.info.jvmargs}\"/>\n            <test name=\"${profile.class}\"/>\n            <classpath>\n                <path path=\"${run.test.classpath}\"/>\n                <path path=\"${j2ee.platform.classpath}\"/>\n            </classpath>\n            <syspropertyset>\n                <propertyref prefix=\"test-sys-prop.\"/>\n                <mapper from=\"test-sys-prop.*\" to=\"*\" type=\"glob\"/>\n            </syspropertyset>\n            <formatter type=\"brief\" usefile=\"false\"/>\n            <formatter type=\"xml\"/>\n        </junit>\n    </target>\n    <target if=\"netbeans.home\" name=\"-profile-check\">\n        <condition property=\"profiler.configured\">\n            <or>\n                <contains casesensitive=\"true\" string=\"${run.jvmargs.ide}\" substring=\"-agentpath:\"/>\n                <contains casesensitive=\"true\" string=\"${run.jvmargs.ide}\" substring=\"-javaagent:\"/>\n            </or>\n        </condition>\n    </target>\n    <target depends=\"init,-init-cos,compile,compile-jsps,-do-compile-single-jsp,-pre-dist,-do-tmp-dist-with-manifest,-do-tmp-dist-without-manifest\" name=\"-do-profile\">\n        <startprofiler/>\n        <nbstartserver profilemode=\"true\"/>\n        <nbdeploy clientUrlPart=\"${client.urlPart}\" forceRedeploy=\"true\" profilemode=\"true\"/>\n        <antcall target=\"debug-display-browser-old\"/>\n        <antcall target=\"debug-display-browser\"/>\n        <antcall target=\"-profile-start-loadgen\"/>\n    </target>\n    <target depends=\"-profile-check,-profile-pre72\" description=\"Profile a J2EE project in the IDE.\" if=\"profiler.configured\" name=\"profile\" unless=\"profiler.info.jvmargs.agent\">\n        <antcall target=\"-do-profile\"/>\n    </target>\n    <target depends=\"-profile-test-single-pre72\" name=\"profile-test-single\"/>\n    <target depends=\"-profile-check\" if=\"profiler.configured\" name=\"profile-test\" unless=\"profiler.info.jvmargs.agent\">\n        <startprofiler/>\n        <antcall target=\"test-single\"/>\n    </target>\n    <target if=\"profiler.loadgen.path\" name=\"-profile-start-loadgen\">\n        <loadgenstart path=\"${profiler.loadgen.path}\"/>\n    </target>\n    <!--\n                JAVADOC SECTION\n            -->\n    <target depends=\"init\" if=\"have.sources\" name=\"javadoc-build\">\n        <mkdir dir=\"${dist.javadoc.dir}\"/>\n        <javadoc additionalparam=\"${javadoc.additionalparam}\" author=\"${javadoc.author}\" charset=\"UTF-8\" destdir=\"${dist.javadoc.dir}\" docencoding=\"UTF-8\" encoding=\"${javadoc.encoding.used}\" failonerror=\"true\" noindex=\"${javadoc.noindex}\" nonavbar=\"${javadoc.nonavbar}\" notree=\"${javadoc.notree}\" private=\"${javadoc.private}\" source=\"${javac.source}\" splitindex=\"${javadoc.splitindex}\" use=\"${javadoc.use}\" useexternalfile=\"true\" version=\"${javadoc.version}\" windowtitle=\"${javadoc.windowtitle}\">\n            <classpath>\n                <path path=\"${javac.classpath}:${j2ee.platform.classpath}\"/>\n            </classpath>\n            <fileset dir=\"${src.dir}\" excludes=\"${excludes}\" includes=\"${includes}\">\n                <filename name=\"**/*.java\"/>\n            </fileset>\n            <fileset dir=\"${build.generated.sources.dir}\" erroronmissingdir=\"false\">\n                <include name=\"**/*.java\"/>\n            </fileset>\n        </javadoc>\n        <copy todir=\"${dist.javadoc.dir}\">\n            <fileset dir=\"${src.dir}\" excludes=\"${excludes}\" includes=\"${includes}\">\n                <filename name=\"**/doc-files/**\"/>\n            </fileset>\n            <fileset dir=\"${build.generated.sources.dir}\" erroronmissingdir=\"false\">\n                <include name=\"**/doc-files/**\"/>\n            </fileset>\n        </copy>\n    </target>\n    <target depends=\"init,javadoc-build\" if=\"netbeans.home\" name=\"javadoc-browse\" unless=\"no.javadoc.preview\">\n        <nbbrowse file=\"${dist.javadoc.dir}/index.html\"/>\n    </target>\n    <target depends=\"init,javadoc-build,javadoc-browse\" description=\"Build Javadoc.\" name=\"javadoc\"/>\n    <!--\n                \n                TEST COMPILATION SECTION\n            -->\n    <target depends=\"init,compile\" if=\"have.tests\" name=\"-pre-pre-compile-test\">\n        <mkdir dir=\"${build.test.classes.dir}\"/>\n        <property name=\"j2ee.platform.embeddableejb.classpath\" value=\"\"/>\n    </target>\n    <target name=\"-pre-compile-test\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target depends=\"init,compile,-pre-pre-compile-test,-pre-compile-test\" if=\"have.tests\" name=\"-do-compile-test\">\n        <webproject2:javac classpath=\"${javac.test.classpath}:${j2ee.platform.classpath}:${j2ee.platform.embeddableejb.classpath}\" debug=\"true\" destdir=\"${build.test.classes.dir}\" srcdir=\"${test.src.dir}\"/>\n        <copy todir=\"${build.test.classes.dir}\">\n            <fileset dir=\"${test.src.dir}\" excludes=\"${build.classes.excludes},${excludes}\" includes=\"${includes}\"/>\n        </copy>\n    </target>\n    <target name=\"-post-compile-test\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target depends=\"init,compile,-pre-pre-compile-test,-pre-compile-test,-do-compile-test,-post-compile-test\" name=\"compile-test\"/>\n    <target name=\"-pre-compile-test-single\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target depends=\"init,compile,-pre-pre-compile-test,-pre-compile-test-single\" if=\"have.tests\" name=\"-do-compile-test-single\">\n        <fail unless=\"javac.includes\">Must select some files in the IDE or set javac.includes</fail>\n        <webproject2:javac classpath=\"${javac.test.classpath}:${j2ee.platform.classpath}:${j2ee.platform.embeddableejb.classpath}\" debug=\"true\" destdir=\"${build.test.classes.dir}\" excludes=\"\" includes=\"${javac.includes}\" srcdir=\"${test.src.dir}\"/>\n        <copy todir=\"${build.test.classes.dir}\">\n            <fileset dir=\"${test.src.dir}\" excludes=\"${build.classes.excludes},${excludes}\" includes=\"${includes}\"/>\n        </copy>\n    </target>\n    <target name=\"-post-compile-test-single\">\n        <!-- Empty placeholder for easier customization. -->\n        <!-- You can override this target in the ../build.xml file. -->\n    </target>\n    <target depends=\"init,compile,-pre-pre-compile-test,-pre-compile-test-single,-do-compile-test-single,-post-compile-test-single\" name=\"compile-test-single\"/>\n    <!--\n                \n                TEST EXECUTION SECTION\n            -->\n    <target depends=\"init\" if=\"have.tests\" name=\"-pre-test-run\">\n        <mkdir dir=\"${build.test.results.dir}\"/>\n    </target>\n    <target depends=\"init,compile-test,-pre-test-run\" if=\"have.tests\" name=\"-do-test-run\">\n        <webproject2:test includes=\"${includes}\" testincludes=\"**/*Test.java\"/>\n    </target>\n    <target depends=\"init,compile-test,-pre-test-run,-do-test-run\" if=\"have.tests\" name=\"-post-test-run\">\n        <fail if=\"tests.failed\" unless=\"ignore.failing.tests\">Some tests failed; see details above.</fail>\n    </target>\n    <target depends=\"init\" if=\"have.tests\" name=\"test-report\"/>\n    <target depends=\"init\" if=\"netbeans.home+have.tests\" name=\"-test-browse\"/>\n    <target depends=\"init,compile-test,-pre-test-run,-do-test-run,test-report,-post-test-run,-test-browse\" description=\"Run unit tests.\" name=\"test\"/>\n         const treeRoot = document.getElementById('treeRoot');
        const fileInput = document.getElementById('fileInput');
        const codeContent = document.getElementById('codeContent');
        const codeBlock = document.getElementById('codeBlock');
        const placeholder = document.getElementById('placeholder');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const hamburger = document.getElementById('hamburger');

        let globalFiles = {};

        function init() {
            // Load preloaded projects
            Object.keys(PRELOADED_DATA).forEach(projectName => {
                addProjectToTree(projectName, PRELOADED_DATA[projectName]);
            });
            
            hamburger.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            const projectName = files[0].webkitRelativePath.split('/')[0];
            const projectData = {};

            for (let file of files) {
                const relPath = file.webkitRelativePath.split('/').slice(1).join('/');
                if (relPath) {
                    // Only read text-like files for performance
                    const ext = file.name.split('.').pop().toLowerCase();
                    const readable = ['java', 'jsp', 'xml', 'html', 'css', 'js', 'txt', 'properties', 'md'].includes(ext);
                    if (readable) {
                        projectData[relPath] = await file.text();
                    }
                }
            }
            addProjectToTree(projectName, projectData);
        });

        function addProjectToTree(projectName, data) {
            const rootNode = { name: projectName, isFolder: true, children: {}, fullPath: projectName };
            
            Object.keys(data).forEach(path => {
                const parts = path.split('/');
                let current = rootNode;
                let currentPath = projectName;

                parts.forEach((part, index) => {
                    currentPath += '/' + part;
                    if (!current.children[part]) {
                        const isLast = index === parts.length - 1;
                        current.children[part] = {
                            name: part,
                            isFolder: !isLast,
                            children: {},
                            fullPath: currentPath,
                            content: isLast ? data[path] : null
                        };
                    }
                    current = current.children[part];
                });
            });

            const dom = createTreeDOM(rootNode);
            treeRoot.appendChild(dom);
        }

        function createTreeDOM(node) {
            const container = document.createElement('div');
            container.className = 'tree-node';
            
            const item = document.createElement('div');
            item.className = 'tree-item';
            
            const icon = document.createElement('i');
            icon.className = 'icon ' + (node.isFolder ? 'folder-icon' : 'file-icon');
            if (!node.isFolder) {
                const ext = node.name.split('.').pop().toLowerCase();
                icon.textContent = getFileEmoji(ext);
            }

            const name = document.createElement('span');
            name.textContent = node.name;

            item.appendChild(icon);
            item.appendChild(name);
            container.appendChild(item);

            if (node.isFolder) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'children';
                
                // Sort folders first, then files
                const sortedKeys = Object.keys(node.children).sort((a, b) => {
                    if (node.children[a].isFolder && !node.children[b].isFolder) return -1;
                    if (!node.children[a].isFolder && node.children[b].isFolder) return 1;
                    return a.localeCompare(b);
                });

                sortedKeys.forEach(key => {
                    childrenContainer.appendChild(createTreeDOM(node.children[key]));
                });
                
                container.appendChild(childrenContainer);

                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    container.classList.toggle('folder-open');
                });
            } else {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    displayFile(node);
                    
                    // Highlight active
                    document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('open');
                        overlay.classList.remove('active');
                    }
                });
            }

            return container;
        }

        function getFileEmoji(ext) {
            switch(ext) {
                case 'java': return '☕';
                case 'jsp': return '📄';
                case 'xml': return '🌐';
                case 'html': return '🌐';
                case 'css': return '🎨';
                case 'js': return '📜';
                default: return '📄';
            }
        }

        function displayFile(node) {
            const ext = node.name.split('.').pop().toLowerCase();
            let lang = 'markup';
            if (ext === 'java') lang = 'java';
            // Force .jsp to use html (markup) view mode as requested
            if (ext === 'jsp') lang = 'markup'; 
            if (ext === 'js') lang = 'javascript';
            if (ext === 'css') lang = 'css';
            
            placeholder.style.display = 'none';
            codeBlock.classList.remove('hidden');
            codeContent.className = `language-${lang}`;
            codeContent.textContent = node.content;
            Prism.highlightElement(codeContent);
            document.getElementById('mainContent').scrollTop = 0;
        }

        init();
    </script>
</body>
</html>
