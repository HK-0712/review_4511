<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Viewer - Workshop7_trial</title>
    <!-- Prism.js CDN for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --sidebar-width: 300px;
            --header-height: 60px;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header & Mobile Toggle */
        header {
            height: var(--header-height);
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            flex-grow: 1;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            border: 1px solid #fff;
            color: white;
            background-color: transparent;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Main Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        aside {
            width: var(--sidebar-width);
            background-color: white;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 900;
        }

        .file-list {
            list-style: none;
            padding: 10px 0;
        }

        .file-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            word-break: break-all;
            display: flex;
            align-items: center;
        }

        .file-item:hover {
            background-color: #f0f0f0;
        }

        .file-item.active {
            background-color: #e3f2fd;
            border-left: 4px solid var(--accent-color);
            color: var(--accent-color);
        }

        .file-icon {
            margin-right: 10px;
            font-size: 16px;
        }

        /* Content Area */
        main {
            flex: 1;
            overflow: auto;
            background-color: #fff;
            position: relative;
        }

        pre {
            margin: 0 !important;
            border-radius: 0 !important;
            min-height: 100%;
            font-size: 14px;
        }

        code {
            font-family: 'Consolas', 'Monaco', 'Andale Mono', 'Ubuntu Mono', monospace !important;
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 20px;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            aside {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            }

            aside.open {
                transform: translateX(0);
            }

            .overlay {
                display: none;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 850;
            }

            .overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="logo">Code Viewer</div>
        <div class="upload-btn-wrapper">
            <button class="btn">選擇專案資料夾</button>
            <input type="file" id="fileInput" webkitdirectory directory multiple>
        </div>
    </header>

    <div class="container">
        <div class="overlay" id="overlay"></div>
        <aside id="sidebar">
            <ul class="file-list" id="fileList">
                <!-- Files will be listed here -->
            </ul>
        </aside>
        <main id="mainContent">
            <div class="placeholder" id="placeholder">
                <p>請點擊上方按鈕選擇一個專案資料夾</p>
                <p style="font-size: 0.8rem; margin-top: 10px;">(支援 .java, .jsp, .xml, .html, .css, .js)</p>
            </div>
            <pre id="codeBlock" class="hidden"><code id="codeContent" class="language-java"></code></pre>
        </main>
    </div>

    <!-- Prism.js Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const codeContent = document.getElementById('codeContent');
        const codeBlock = document.getElementById('codeBlock');
        const placeholder = document.getElementById('placeholder');
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        let filesMap = {};

        // Toggle Sidebar for Mobile
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        hamburger.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Handle File Selection
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            fileList.innerHTML = '';
            filesMap = {};

            const sortedFiles = Array.from(files).sort((a, b) => a.webkitRelativePath.localeCompare(b.webkitRelativePath));

            sortedFiles.forEach((file, index) => {
                // Filter for readable text files
                const ext = file.name.split('.').pop().toLowerCase();
                const readableExts = ['java', 'jsp', 'xml', 'html', 'css', 'js', 'txt', 'properties', 'md'];
                
                if (readableExts.includes(ext)) {
                    filesMap[index] = file;
                    
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.dataset.index = index;
                    
                    // Display relative path for context
                    const pathParts = file.webkitRelativePath.split('/');
                    const fileName = pathParts.slice(1).join('/'); // Remove the root folder name for cleaner list
                    
                    li.innerHTML = `<span class="file-icon">${getFileIcon(ext)}</span> ${fileName}`;
                    li.addEventListener('click', () => loadFile(index, li));
                    fileList.appendChild(li);
                }
            });

            if (fileList.innerHTML === '') {
                fileList.innerHTML = '<li class="file-item">未找到支援的檔案</li>';
            }
        });

        function getFileIcon(ext) {
            switch(ext) {
                case 'java': return '☕';
                case 'jsp': return '📄';
                case 'xml': return '🌐';
                case 'html': return '🌐';
                case 'css': return '🎨';
                case 'js': return '📜';
                default: return '📄';
            }
        }

        function loadFile(index, element) {
            const file = filesMap[index];
            const reader = new FileReader();

            // Highlight active item
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            reader.onload = (e) => {
                const content = e.target.result;
                const ext = file.name.split('.').pop().toLowerCase();
                
                // Map extension to Prism language
                let lang = 'markup';
                if (ext === 'java') lang = 'java';
                if (ext === 'jsp') lang = 'jsp';
                if (ext === 'js') lang = 'javascript';
                if (ext === 'css') lang = 'css';
                if (ext === 'xml' || ext === 'html') lang = 'markup';

                placeholder.style.display = 'none';
                codeBlock.classList.remove('hidden');
                
                // Set code and language class
                codeContent.className = `language-${lang}`;
                codeContent.textContent = content;

                // Trigger Prism highlighting
                Prism.highlightElement(codeContent);

                // Auto-close sidebar on mobile after selection
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
                
                // Scroll to top
                document.getElementById('mainContent').scrollTop = 0;
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
